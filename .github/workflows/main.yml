name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Android Project Files
        run: |
          python3 - << 'PYEOF'
          import os

          files = {}

          files["settings.gradle"] = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoLog"
          include ':app'
          """

          files["build.gradle"] = """plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          """

          files["gradle.properties"] = """org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          """

          files["app/build.gradle"] = """plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'ru.autolog.app'
              compileSdk 34

              defaultConfig {
                  applicationId "ru.autolog.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.9.0'
              implementation 'org.jsoup:jsoup:1.17.2'
          }
          """

          files["app/src/main/AndroidManifest.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AutoLog">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          """

          files["app/src/main/res/drawable/ic_launcher.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#161920"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#2563EB"
                  android:pathData="M22,22h64c6.6,0 12,5.4 12,12v40c0,6.6 -5.4,12 -12,12H22c-6.6,0 -12,-5.4 -12,-12V34c0,-6.6 5.4,-12 12,-12z"
                  android:fillAlpha="0.18" />
              <path
                  android:strokeColor="#3B82F6"
                  android:strokeWidth="4.5"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M30,62 L36,42 C37.2,38.5 40.5,36 44.2,36 L63.8,36 C67.5,36 70.8,38.5 72,42 L78,62" />
              <path
                  android:strokeColor="#F8FAFC"
                  android:strokeWidth="4.5"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M24,62 L84,62 L84,72 C84,74.2 82.2,76 80,76 L76,76 C73.8,76 72,74.2 72,72 L72,68 L36,68 L36,72 C36,74.2 34.2,76 32,76 L28,76 C25.8,76 24,74.2 24,72 Z" />
              <path
                  android:fillColor="#C89D54"
                  android:pathData="M35,55m-4,0a4,4 0,1 1,8 0a4,4 0,1 1,-8 0" />
              <path
                  android:fillColor="#C89D54"
                  android:pathData="M73,55m-4,0a4,4 0,1 1,8 0a4,4 0,1 1,-8 0" />
          </vector>
          """

          files["app/src/main/res/values/strings.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">AutoLog</string>
          </resources>
          """

          files["app/src/main/res/values/themes.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AutoLog" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#F3F4F6</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
              </style>
          </resources>
          """

          files["app/src/main/java/ru/autolog/app/MainActivity.kt"] = """package ru.autolog.app

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowInsetsControllerCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import org.jsoup.Jsoup
          import java.net.URLEncoder
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private var fileUploadCallback: ValueCallback<Array<Uri>>? = null

              private val fileChooserLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == Activity.RESULT_OK) {
                      val data = result.data
                      val results: Array<Uri>? = when {
                          data?.data != null -> arrayOf(data.data!!)
                          data?.clipData != null -> {
                              val clip = data.clipData!!
                              Array(clip.itemCount) { i -> clip.getItemAt(i).uri }
                          }
                          else -> null
                      }
                      fileUploadCallback?.onReceiveValue(results)
                  } else {
                      fileUploadCallback?.onReceiveValue(null)
                  }
                  fileUploadCallback = null
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }

                  webView.addJavascriptInterface(NativeBridge(), "AndroidNative")

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(
                          view: WebView?,
                          request: WebResourceRequest?
                      ): Boolean {
                          val url = request?.url?.toString() ?: return false
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              try {
                                  startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                              } catch (_: Exception) {}
                              return true
                          }
                          return false
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          fileUploadCallback?.onReceiveValue(null)
                          fileUploadCallback = filePathCallback

                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "image/*"
                          }
                          fileChooserLauncher.launch(Intent.createChooser(intent, "Выберите фото"))
                          return true
                      }
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          webView.evaluateJavascript("window.handleAndroidBack && window.handleAndroidBack()") { res ->
                              if (res != "true") {
                                  if (webView.canGoBack()) {
                                      webView.goBack()
                                  } else {
                                      finish()
                                  }
                              }
                          }
                      }
                  })

                  webView.loadUrl("file:///android_asset/index.html")
              }

              inner class NativeBridge {

                  @JavascriptInterface
                  fun syncSystemBars(bgHex: String, isDark: Boolean) {
                      runOnUiThread {
                          try {
                              val color = Color.parseColor(bgHex)
                              window.statusBarColor = color
                              window.navigationBarColor = color
                              val controller = WindowInsetsControllerCompat(window, window.decorView)
                              controller.isAppearanceLightStatusBars = !isDark
                              controller.isAppearanceLightNavigationBars = !isDark
                          } catch (_: Exception) {}
                      }
                  }

                  @JavascriptInterface
                  fun searchPartNative(rawQuery: String) {
                      thread {
                          val result = JSONObject()
                          val clean = rawQuery.trim().uppercase()
                          result.put("query", clean)

                          var detectedTitle = ""
                          var detectedBrand = ""
                          var euroAutoNewPrice = 0
                          var euroAutoUsedPrice = 0
                          var dromPrice = 0
                          val articles = JSONArray()

                          val ua = "Mozilla/5.0 (Linux; Android 14; Pixel 9 Pro XL) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36"

                          try {
                              val eaUrl = "https://euroauto.ru/search/?q=" + URLEncoder.encode(clean, "UTF-8")
                              val doc = Jsoup.connect(eaUrl)
                                  .userAgent(ua)
                                  .timeout(6500)
                                  .ignoreHttpErrors(true)
                                  .get()

                              val pageTitle = doc.selectFirst("h1")?.text() ?: doc.title()
                              if (pageTitle.isNotBlank() && !pageTitle.contains("Поиск", ignoreCase = true)) {
                                  detectedTitle = pageTitle
                                      .replace(Regex("(?i)купить.*"), "")
                                      .replace(Regex("(?i)в Санкт-Петербурге.*"), "")
                                      .replace(Regex("(?i)в Москве.*"), "")
                                      .replace(Regex("(?i)ЕвроАвто.*"), "")
                                      .trim(' ', '-', '—', ',', '.')
                              }

                              val bodyText = doc.body()?.text() ?: ""
                              val priceMatches = Regex("(\d[\d\s]{1,6})\s*₽").findAll(bodyText)
                                  .mapNotNull { it.groupValues[1].replace("\s".toRegex(), "").toIntOrNull() }
                                  .filter { it in 150..250000 }
                                  .sorted()
                                  .toList()

                              if (priceMatches.isNotEmpty()) {
                                  euroAutoUsedPrice = priceMatches.first()
                                  euroAutoNewPrice = if (priceMatches.size > 1) priceMatches[priceMatches.size / 2] else priceMatches.first()
                              }
                          } catch (_: Exception) {}

                          try {
                              val dromUrl = "https://baza.drom.ru/sell_spare_parts/?query=" + URLEncoder.encode(clean, "UTF-8")
                              val doc = Jsoup.connect(dromUrl)
                                  .userAgent(ua)
                                  .timeout(6500)
                                  .ignoreHttpErrors(true)
                                  .get()

                              val firstBull = doc.selectFirst("[data-ftid='bull_title'], .bull-item__self-link, a.bulletinLink")
                              if (detectedTitle.isBlank() && firstBull != null) {
                                  detectedTitle = firstBull.text().trim()
                              }

                              val priceEl = doc.selectFirst("[data-ftid='bull_price'], .price-block__price")
                              if (priceEl != null) {
                                  val p = priceEl.text().replace(Regex("[^0-9]"), "").toIntOrNull() ?: 0
                                  if (p in 100..300000) dromPrice = p
                              }
                          } catch (_: Exception) {}

                          try {
                              val ddgUrl = "https://html.duckduckgo.com/html/?q=" + URLEncoder.encode("$clean запчасть артикул", "UTF-8")
                              val doc = Jsoup.connect(ddgUrl)
                                  .userAgent(ua)
                                  .timeout(6000)
                                  .get()

                              val links = doc.select(".result__a")
                              for (link in links) {
                                  val t = link.text().trim()
                                  if (detectedTitle.isBlank() && t.length > 8 && !t.contains("DuckDuckGo")) {
                                      detectedTitle = t
                                          .replace(Regex("(?i)купить.*"), "")
                                          .replace(Regex("(?i)—.*"), "")
                                          .replace(Regex("(?i)\|.*"), "")
                                          .trim()
                                      break
                                  }
                              }
                          } catch (_: Exception) {}

                          result.put("detectedTitle", detectedTitle)
                          result.put("detectedBrand", detectedBrand)
                          result.put("euroAutoNewPrice", euroAutoNewPrice)
                          result.put("euroAutoUsedPrice", euroAutoUsedPrice)
                          result.put("dromPrice", dromPrice)
                          result.put("articles", articles)

                          val jsonEscaped = result.toString()
                          runOnUiThread {
                              webView.evaluateJavascript("window.onNativePartParsed && window.onNativePartParsed($jsonEscaped)", null)
                          }
                      }
                  }
              }
          }
          """

          files["app/src/main/assets/index.html"] = """<!DOCTYPE html>
          <html lang="ru">
          <head>
