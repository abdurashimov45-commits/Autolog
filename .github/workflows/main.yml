                const drive2Html = item.drive2.map(d => `
                  <a href="https://www.google.com/search?q=${encodeURIComponent(d.q)}" target="_blank" rel="noopener" class="offer-card" style="text-decoration:none; color:inherit;">
                    <div><div style="font-size:10px; font-weight:700; color:#E11D48; text-transform:uppercase;">DRIVE2.RU · ${d.tag}</div><div style="font-size:13px; font-weight:600; margin-top:2px;">${d.title}</div></div>
                    <span style="color:var(--accent); font-weight:700;">↗</span>
                  </a>
                `).join('');
                return `
                  <div class="card" style="margin-bottom:14px;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
                      <div><span class="badge" style="background:var(--accent-soft); color:var(--accent);">${item.brand} · ${item.article}</span><h3 style="font-size:16px; font-weight:700; margin-top:6px;">${item.title}</h3></div>
                      <button class="btn btn-ghost" onclick="promptCustomPartTitle('${item.article}', '${item.title.replace(/'/g,"")}', '${item.brand.replace(/'/g,"")}')">✎</button>
                    </div>
                    <div style="font-size:12px; color:var(--text-secondary); margin-top:6px;">${item.specs}</div>
                    <div style="font-size:11px; color:var(--text-muted); margin-top:4px;"><b>Применимость:</b> ${item.applicability}</div>
                    <div class="chips-row">${item.crosses.map(c => `<span class="chip mono" onclick="setAndSearchPart('${c}')">Кросс: ${c}</span>`).join('')}</div>
                  </div>
                  <div class="card" style="margin-bottom:14px;">
                    <div class="section-head"><span class="section-title">Прямой переход к ценам на площадках</span></div>
                    <div class="stores-grid">
                      <a class="store-btn" href="https://euroauto.ru/search/?q=${qEnc}" target="_blank" rel="noopener"><div>ЕвроАвто<span class="store-tag">Новые + разборка СПб/РФ</span></div><span>↗</span></a>
                      <a class="store-btn" href="https://baza.drom.ru/sell_spare_parts/?query=${qEnc}" target="_blank" rel="noopener"><div>Дром Запчасти<span class="store-tag">baza.drom.ru · Новые и Б/У</span></div><span>↗</span></a>
                      <a class="store-btn" href="https://www.autodoc.ru/price/500/${artEnc}" target="_blank" rel="noopener"><div>Автодок<span class="store-tag">Опт-цены и кроссы</span></div><span>↗</span></a>
                      <a class="store-btn" href="https://www.zzap.ru/public/search.aspx#rawdata=${qEnc}" target="_blank" rel="noopener"><div>ZZap.ru<span class="store-tag">Минимальные цены оптовиков</span></div><span>↗</span></a>
                      <a class="store-btn" href="https://www.avito.ru/rossiya/zapchasti_i_aksessuary?q=${qEnc}" target="_blank" rel="noopener"><div>Авито<span class="store-tag">Частные объявления и разбор</span></div><span>↗</span></a>
                      <a class="store-btn" href="https://www.google.com/search?q=${encodeURIComponent('site:drive2.ru ' + rawQuery)}" target="_blank" rel="noopener"><div>Drive2.ru<span class="store-tag">Бортжурналы и отчёты</span></div><span>↗</span></a>
                    </div>
                  </div>
                  <div class="card" style="margin-bottom:14px;"><div class="section-head"><span class="section-title">Ориентиры цен (ЕвроАвто и Дром Запчасти)</span></div>${offersHtml}</div>
                  <div class="card"><div class="section-head"><span class="section-title">Инструкции по замене и опыт на Drive2</span></div>${drive2Html}</div>
                `;
              }
              function openExpenseModal(prefill) {
                document.getElementById('expenseModal').classList.add('open');
                document.getElementById('expMileageInput').value = state.car.mileage;
                document.getElementById('expDateInput').value = new Date().toISOString().slice(0, 10);
                if (prefill) {
                  state.modalCategory = prefill.category || 'parts';
                  document.getElementById('expTitleInput').value = prefill.title || '';
                  document.getElementById('expVendorInput').value = prefill.vendor || '';
                  document.getElementById('expPartInput').value = prefill.partNumber || '';
                  document.getElementById('expAmountInput').value = prefill.amount || '';
                } else {
                  document.getElementById('expTitleInput').value = '';
                  document.getElementById('expVendorInput').value = '';
                  document.getElementById('expPartInput').value = '';
                  document.getElementById('expAmountInput').value = '';
                }
                renderModalCategoryRow(); renderModalSuggestions();
              }
              function closeExpenseModal() { document.getElementById('expenseModal').classList.remove('open'); }
              function prefillExpenseFromPart(title, store, partNo, price) { openExpenseModal({ category: 'parts', title, vendor: store, partNumber: partNo, amount: price }); }
              function selectModalCategory(catKey) { state.modalCategory = catKey; renderModalCategoryRow(); renderModalSuggestions(); }
              function renderModalCategoryRow() {
                document.getElementById('modalCategoryRow').innerHTML = Object.entries(CATEGORIES).map(([k, v]) => `<button class="chip ${state.modalCategory === k ? 'active' : ''}" onclick="selectModalCategory('${k}')">${v.icon} ${v.label}</button>`).join('');
                document.getElementById('partNumberBox').style.display = (state.modalCategory === 'parts' || state.modalCategory === 'service' || state.modalCategory === 'tuning') ? 'block' : 'none';
              }
              function renderModalSuggestions() {
                const cat = state.modalCategory, catDef = CATEGORIES[cat] || CATEGORIES.other;
                const histTitles = [...new Set(state.expenses.filter(e => e.category === cat).map(e => e.title))];
                const stockTitles = catDef.titles.filter(t => !histTitles.includes(t));
                document.getElementById('titleSuggestRow').innerHTML = [
                  ...histTitles.slice(0, 4).map(t => `<button class="chip chip-history" onclick="setModalField('expTitleInput', '${t.replace(/'/g,"")}')">↺ Ранее: ${t}</button>`),
                  ...stockTitles.slice(0, 4).map(t => `<button class="chip" onclick="setModalField('expTitleInput', '${t.replace(/'/g,"")}')">${t}</button>`)
                ].join('');
                const histVendors = [...new Set(state.expenses.filter(e => e.category === cat && e.vendor).map(e => e.vendor))];
                const stockVendors = catDef.vendors.filter(v => !histVendors.includes(v));
                document.getElementById('vendorSuggestRow').innerHTML = [
                  ...histVendors.slice(0, 4).map(v => `<button class="chip chip-history" onclick="setModalField('expVendorInput', '${v.replace(/'/g,"")}')">↺ ${v}</button>`),
                  ...stockVendors.slice(0, 4).map(v => `<button class="chip" onclick="setModalField('expVendorInput', '${v.replace(/'/g,"")}')">${v}</button>`)
                ].join('');
                const histParts = [...new Set(state.expenses.filter(e => e.partNumber).map(e => e.partNumber))];
                document.getElementById('partSuggestRow').innerHTML = histParts.slice(0, 4).map(p => `<button class="chip chip-history mono" onclick="setModalPartAndDetect('${p}')">↺ ${p}</button>`).join('');
              }
              function setModalField(id, val) { document.getElementById(id).value = val; }
              function setModalPartAndDetect(partNo) { document.getElementById('expPartInput').value = partNo; autoFillFromModalPart(); }
              function autoFillFromModalPart() {
                const val = document.getElementById('expPartInput').value.trim();
                if (!val) return;
                const { brandHint, article } = normalizePartQuery(val);
                const known = KNOWN_PARTS_DB[article] || state.customPartsCache[article];
                if (known) {
                  document.getElementById('expTitleInput').value = known.title;
                  if (known.brand) document.getElementById('expVendorInput').value = known.brand;
                  showToast('Деталь распознана: ' + known.title);
                } else {
                  document.getElementById('expTitleInput').value = 'Запчасть ' + val.toUpperCase();
                  if (brandHint) document.getElementById('expVendorInput').value = brandHint;
                  showToast('Артикул подставлен');
                }
              }
              function saveNewExpense() {
                const amount = Number(document.getElementById('expAmountInput').value);
                const title = document.getElementById('expTitleInput').value.trim();
                const vendor = document.getElementById('expVendorInput').value.trim();
                const partNumber = document.getElementById('expPartInput').value.trim().toUpperCase();
                const mileage = Number(document.getElementById('expMileageInput').value) || state.car.mileage;
                const date = document.getElementById('expDateInput').value || new Date().toISOString().slice(0, 10);
                if (!amount || !title) { showToast('Укажите сумму и наименование расхода'); return; }
                state.expenses.unshift({ id: Date.now(), category: state.modalCategory, title, vendor, partNumber, amount, mileage, date });
                if (mileage > state.car.mileage) { state.car.mileage = mileage; SafeStore.set('autolog_car', state.car); }
                if (partNumber && title) {
                  const { article } = normalizePartQuery(partNumber);
                  state.customPartsCache[article] = { title, brand: vendor };
                  SafeStore.set('autolog_parts_cache', state.customPartsCache);
                }
                SafeStore.set('autolog_expenses', state.expenses);
                closeExpenseModal(); renderOverview(); renderJournal(); renderAnalytics(); showToast('Запись добавлена в бортжурнал');
              }
              function renderJournal() {
                const allChip = `<button class="chip ${state.journalFilterCat === 'all' ? 'active' : ''}" onclick="setJournalCat('all')">Все (${state.expenses.length})</button>`;
                const catChips = Object.entries(CATEGORIES).map(([k, v]) => `<button class="chip ${state.journalFilterCat === k ? 'active' : ''}" onclick="setJournalCat('${k}')">${v.icon} ${v.label}</button>`).join('');
                document.getElementById('journalCategoryChips').innerHTML = allChip + catChips;
                const q = (document.getElementById('journalFilterInput').value || '').trim().toLowerCase();
                const filtered = state.expenses.filter(e => {
                  if (state.journalFilterCat !== 'all' && e.category !== state.journalFilterCat) return false;
                  if (!q) return true;
                  return (e.title || '').toLowerCase().includes(q) || (e.vendor || '').toLowerCase().includes(q) || (e.partNumber || '').toLowerCase().includes(q);
                });
                document.getElementById('fullJournalList').innerHTML = filtered.length ? filtered.map(renderExpenseCard).join('') : `<div class="card" style="text-align:center;color:var(--text-muted);padding:24px;">По вашему запросу записей не найдено</div>`;
              }
              function setJournalCat(cat) { state.journalFilterCat = cat; renderJournal(); }
              function renderAnalytics() {
                const total = Math.max(1, state.expenses.reduce((s, e) => s + Number(e.amount || 0), 0));
                const sums = {}; Object.keys(CATEGORIES).forEach(k => sums[k] = 0);
                state.expenses.forEach(e => { sums[e.category] = (sums[e.category] || 0) + Number(e.amount || 0); });
                let angle = 0; const radius = 50, circumference = 2 * Math.PI * radius;
                let circlesSvg = '', legendHtml = '';
                Object.entries(CATEGORIES).forEach(([k, v]) => {
                  const val = sums[k] || 0; if (val <= 0) return;
                  const frac = val / total, strokeLen = frac * circumference, offset = -angle * circumference; angle += frac;
                  circlesSvg += `<circle r="${radius}" cx="65" cy="65" fill="transparent" stroke="${v.color}" stroke-width="18" stroke-dasharray="${strokeLen} ${circumference}" stroke-dashoffset="${offset}" transform="rotate(-90 65 65)" />`;
                  legendHtml += `<div style="display:flex; align-items:center; justify-content:space-between; font-size:12px; margin-bottom:6px;"><div style="display:flex; align-items:center; gap:7px;"><span style="width:10px; height:10px; border-radius:3px; background:${v.color}; display:inline-block;"></span><span>${v.label}</span></div><span class="tabular" style="font-weight:700;">${Math.round(frac * 100)}% (${formatRub(val)})</span></div>`;
                });
                document.getElementById('donutContainer').innerHTML = `<svg width="130" height="130" viewBox="0 0 130 130" style="flex-shrink:0;">${circlesSvg}<text x="65" y="62" text-anchor="middle" fill="var(--text-muted)" font-size="9" font-weight="600">ИТОГО</text><text x="65" y="76" text-anchor="middle" fill="var(--text-primary)" font-size="11" font-weight="700">${formatRub(total)}</text></svg><div style="flex:1;">${legendHtml}</div>`;
                const months = [{ label: 'Июн', val: 8400 }, { label: 'Июл', val: 12300 }, { label: 'Авг', val: 7500 }, { label: 'Сен', val: 11850 }, { label: 'Окт', val: 13990 }];
                const maxM = Math.max(...months.map(m => m.val), 1);
                document.getElementById('monthlyBarChart').innerHTML = months.map(m => `<div class="bar-col"><div class="bar-val tabular">${(m.val / 1000).toFixed(1)}к</div><div class="bar-fill" style="height:${Math.round((m.val / maxM) * 85)}%;"></div><div class="bar-label">${m.label}</div></div>`).join('');
              }
              function exportBackupJson() {
                const a = document.createElement('a');
                a.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2)));
                a.setAttribute("download", "autolog_backup.json");
                document.body.appendChild(a); a.click(); a.remove();
                showToast('Файл бэкапа сформирован');
              }
              applyThemeState(); renderOverview(); runPartSearch();
            </script>
          </body>
          </html>
          """

          for path, content in files.items():
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          print("Generated all Android files:", len(files))

          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoLog-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: errorh
